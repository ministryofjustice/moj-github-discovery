apiVersion: apps/v1
kind: Deployment
metadata:
  name: developer-experience-audit-dashboard
  namespace: developer-experience-audit-dashboard-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: developer-experience-audit-dashboard
  template:
    metadata:
      labels:
        app: developer-experience-audit-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: developer-experience-audit-dashboard
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /home/dashboard-runner/.cache
        ports:
        - name: http
          containerPort: 8050
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: developer-experience-audit-dashboard
  namespace: developer-experience-audit-dashboard-prod
spec:
  selector:
    app: developer-experience-audit-dashboard
  ports:
  - port: 80
    targetPort: 8050
    protocol: TCP
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: developer-experience-audit-dashboard
  namespace: developer-experience-audit-dashboard-prod
  annotations:
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    external-dns.alpha.kubernetes.io/set-identifier: "developer-experience-audit-dashboard-developer-experience-audit-dashboard-prod-green"
spec:
  ingressClassName: default
  rules:
  - host: developer-experience-audit-dashboard.service.justice.gov.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: developer-experience-audit-dashboard
            port:
              number: 80
  tls:
  - hosts:
    - developer-experience-audit-dashboard.service.justice.gov.uk
    secretName: developer-experience-audit-dashboard-prod-cert